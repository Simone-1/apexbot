<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ListingSniper</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');
  :root{--bg:#0a0a0f;--panel:#111118;--border:#1e1e2e;--accent:#00ff88;--red:#ff3366;--yellow:#ffcc00;--text:#e0e0ff;--muted:#555577;--mono:'Space Mono',monospace;--sans:'Syne',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#0a0a0f 0%,#111125 100%);}
  .logo{font-size:1.4rem;font-weight:800;letter-spacing:-0.5px;}
  .logo span{color:var(--accent);}
  .paper-badge{background:var(--yellow);color:#000;font-family:var(--mono);font-size:.7rem;font-weight:700;padding:4px 12px;border-radius:2px;letter-spacing:2px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border-bottom:1px solid var(--border);background:var(--border);}
  .metric{background:var(--panel);padding:20px 24px;}
  .metric-label{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
  .metric-value{font-family:var(--mono);font-size:1.6rem;font-weight:700;}
  .green{color:var(--accent);} .red{color:var(--red);} .yellow{color:var(--yellow);}
  .open-trade{margin:24px 28px;padding:20px;border:1px solid var(--accent);border-radius:4px;background:rgba(0,255,136,0.04);display:none;}
  .open-trade.visible{display:block;}
  .open-trade-title{font-size:.7rem;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
  .open-trade-info{font-family:var(--mono);font-size:.9rem;display:flex;gap:32px;flex-wrap:wrap;}
  .open-trade-info span{color:var(--muted);font-size:.75rem;display:block;margin-bottom:2px;}
  .section{padding:0 28px 28px;}
  .section-title{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:20px 0 12px;border-bottom:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.8rem;}
  th{text-align:left;padding:10px 12px;color:var(--muted);font-size:.68rem;letter-spacing:1px;border-bottom:1px solid var(--border);}
  td{padding:12px 12px;border-bottom:1px solid rgba(30,30,46,0.5);}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .badge{display:inline-block;padding:2px 8px;border-radius:2px;font-size:.68rem;font-weight:700;letter-spacing:1px;}
  .badge-tp{background:rgba(0,255,136,0.15);color:var(--accent);}
  .badge-sl{background:rgba(255,51,102,0.15);color:var(--red);}
  .badge-time{background:rgba(85,85,119,0.3);color:var(--muted);}
  .badge-paper{background:rgba(255,204,0,0.15);color:var(--yellow);}
  .logs{background:#08080d;border:1px solid var(--border);border-radius:4px;padding:16px;height:300px;overflow-y:auto;font-family:var(--mono);font-size:.75rem;line-height:1.6;margin-top:16px;}
  .log-time{color:var(--muted);margin-right:8px;}
  .log-info{color:var(--text);} .log-warning{color:var(--yellow);} .log-error{color:var(--red);}
  .empty{color:var(--muted);font-family:var(--mono);font-size:.8rem;padding:20px 0;}
  .status-bar{padding:8px 28px;background:var(--panel);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;gap:24px;}
  .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;animation:blink 1.5s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
  @media(max-width:600px){.metrics{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🎯 Listing<span>Sniper</span></div>
  <div class="paper-badge">PAPER MODE</div>
</div>
<div class="status-bar">
  <div><span class="status-dot"></span><span id="status-text">Connecting...</span></div>
  <div>Scans: <span id="scan-count">—</span></div>
  <div>Last update: <span id="last-update">—</span></div>
</div>
<div class="metrics">
  <div class="metric"><div class="metric-label">Simulated P&L</div><div class="metric-value" id="m-pnl">—</div></div>
  <div class="metric"><div class="metric-label">Total Trades</div><div class="metric-value" id="m-trades">—</div></div>
  <div class="metric"><div class="metric-label">Win Rate</div><div class="metric-value" id="m-winrate">—</div></div>
  <div class="metric"><div class="metric-label">Trade Size</div><div class="metric-value yellow">$30</div></div>
</div>
<div class="open-trade" id="open-trade">
  <div class="open-trade-title">⚡ Active Paper Trade</div>
  <div class="open-trade-info" id="open-trade-info"></div>
</div>
<div class="section">
  <div class="section-title">Trade History (Simulated)</div>
  <table>
    <thead><tr><th>Coin</th><th>Entry</th><th>Exit</th><th>Change</th><th>P&L (Simulated)</th><th>Reason</th><th>Closed</th></tr></thead>
    <tbody id="trade-body"><tr><td colspan="7" class="empty">Waiting for first listing...</td></tr></tbody>
  </table>
</div>
<div class="section">
  <div class="section-title">Live Log</div>
  <div class="logs" id="log-box"><div class="empty">Waiting for activity...</div></div>
</div>
<script>
async function refresh() {
  try {
    const res = await fetch('/state');
    const d = await res.json();
    document.getElementById('status-text').textContent = d.running ? 'Running — monitoring Binance announcements' : 'Stopped';
    document.getElementById('scan-count').textContent = d.scan_count || 0;
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
    const pnl = d.total_pnl || 0;
    const pnlEl = document.getElementById('m-pnl');
    pnlEl.textContent = '$' + (pnl >= 0 ? '+' : '') + pnl.toFixed(2);
    pnlEl.className = 'metric-value ' + (pnl >= 0 ? 'green' : 'red');
    const trades = d.trades || [];
    document.getElementById('m-trades').textContent = trades.length;
    const wins = trades.filter(t => t.pnl > 0).length;
    document.getElementById('m-winrate').textContent = trades.length > 0 ? Math.round(wins/trades.length*100) + '%' : '—';
    const openTrade = d.open_trade;
    const openEl = document.getElementById('open-trade');
    if (openTrade) {
      openEl.classList.add('visible');
      document.getElementById('open-trade-info').innerHTML =
        '<div><span>Symbol</span>' + openTrade.symbol + '</div>' +
        '<div><span>Entry</span>$' + parseFloat(openTrade.entry).toFixed(6) + '</div>' +
        '<div><span>Take Profit</span>$' + parseFloat(openTrade.tp).toFixed(6) + '</div>' +
        '<div><span>Stop Loss</span>$' + parseFloat(openTrade.sl).toFixed(6) + '</div>' +
        '<div><span>Opened</span>' + new Date(openTrade.open_time).toLocaleTimeString() + '</div>';
    } else { openEl.classList.remove('visible'); }
    const tbody = document.getElementById('trade-body');
    if (trades.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">Waiting for first listing...</td></tr>';
    } else {
      tbody.innerHTML = trades.map(t => {
        const bc = t.reason==='TP'?'badge-tp':t.reason==='SL'?'badge-sl':'badge-time';
        const pc = t.pnl>=0?'green':'red';
        const cl = new Date(t.closed).toLocaleDateString()+' '+new Date(t.closed).toLocaleTimeString();
        return '<tr><td>'+t.symbol.replace('USDT','')+'</td><td>$'+parseFloat(t.entry).toFixed(6)+'</td><td>$'+parseFloat(t.exit).toFixed(6)+'</td><td class="'+pc+'">'+(t.pct>=0?'+':'')+t.pct.toFixed(1)+'%</td><td class="'+pc+'">'+(t.pnl>=0?'+':'')+'$'+t.pnl.toFixed(2)+'</td><td><span class="badge '+bc+'">'+t.reason+'</span> <span class="badge badge-paper">PAPER</span></td><td>'+cl+'</td></tr>';
      }).join('');
    }
    const logs = d.logs || [];
    const logBox = document.getElementById('log-box');
    if (logs.length === 0) { logBox.innerHTML = '<div class="empty">Waiting for activity...</div>'; }
    else { logBox.innerHTML = logs.map(l => '<div class="log-'+l.level+'"><span class="log-time">'+l.time+'</span>'+l.msg+'</div>').join(''); }
  } catch(e) { document.getElementById('status-text').textContent = 'Connection error'; }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
